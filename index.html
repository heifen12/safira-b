<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safira | Figurinhas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: #120b1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 430px;
  margin: 35px auto;
  padding: 25px;
  background: #21142e;
  border-radius: 22px;
  border: 1px solid #593675;
}

h1 {
  color: #d8a5ff;
}

p {
  color: #c9b7d8;
}

.escolher {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 15px 0;
  background: #7139a1;
  color: white;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
}

input {
  display: none;
}

img {
  max-width: 100%;
  max-height: 250px;
  border-radius: 15px;
  margin-top: 15px;
}

audio {
  width: 100%;
  margin-top: 20px;
}

button {
  border: none;
  background: #a45bd2;
  color: white;
  padding: 12px 25px;
  border-radius: 12px;
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>💜 Safira</h1>
  <p>Escolha sua imagem e seu áudio!</p>

  <label class="escolher" for="imagem">
    🖼️ Escolher imagem
  </label>
  <input type="file" id="imagem" accept="image/*">

  <div id="previewImagem"></div>

  <label class="escolher" for="audio">
    🎵 Escolher áudio
  </label>
  <input type="file" id="audio" accept="audio/*">

  <div id="previewAudio"></div>

  <button onclick="limpar()">Limpar arquivos</button>
</div>

<script>
let imagemURL = null;
let audioURL = null;

document.getElementById("imagem").addEventListener("change", function() {
  const arquivo = this.files[0];
  if (!arquivo) return;

  if (imagemURL) URL.revokeObjectURL(imagemURL);
  imagemURL = URL.createObjectURL(arquivo);

  document.getElementById("previewImagem").innerHTML =
    `<img src="${imagemURL}" alt="Imagem escolhida">`;
});

document.getElementById("audio").addEventListener("change", function() {
  const arquivo = this.files[0];
  if (!arquivo) return;

  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = URL.createObjectURL(arquivo);

  document.getElementById("previewAudio").innerHTML =
    `<audio controls src="${audioURL}"></audio>`;
});

function limpar() {
  if (imagemURL) URL.revokeObjectURL(imagemURL);
  if (audioURL) URL.revokeObjectURL(audioURL);

  imagemURL = null;
  audioURL = null;

  document.getElementById("imagem").value = "";
  document.getElementById("audio").value = "";
  document.getElementById("previewImagem").innerHTML = "";
  document.getElementById("previewAudio").innerHTML = "";
}
</script>

</body>
</html>
